[package]
name = "rusty-pad"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
# File dialogs through the desktop portal (no GTK dev packages needed)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
